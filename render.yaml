# Render blueprint for the backend.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
# Render reads this file, creates the service, and prompts for the three secrets
# marked `sync: false`.
#
# Playwright is NOT installed here. The API strategy answers in ~600 ms and the browser
# fallback costs ~300 MB of the free tier's 512 MB plus roughly 90 seconds of build time.
# See DESIGN_NOTE.md § trade-offs; `BROWSER_FALLBACK_ENABLED` and the commented build
# command below are all that is needed to turn it on.

services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: free
    region: singapore # closest to the store and to Supabase ap-south-1
    branch: main

    buildCommand: npm ci && npm run build -w backend
    # With the browser fallback:
    # buildCommand: npm ci && npx playwright install --with-deps chromium && npm run build -w backend

    startCommand: node backend/dist/index.js

    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: LOG_LEVEL
        value: info

      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com

      # --- secrets: Render prompts for these on first deploy -----------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

      # Set this to the Vercel origin once the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false

      # --- scraper tuning: the values Phase 1 measured ----------------------
      - key: SCRAPE_MAX_ATTEMPTS
        value: '4'
      - key: SCRAPE_CONCURRENCY
        value: '3'
      - key: SCRAPE_RUN_BUDGET_MS
        value: '240000'
      - key: SCRAPE_HEADERS_TIMEOUT_MS
        value: '12000'
      - key: SCRAPE_BODY_TIMEOUT_MS
        value: '20000'
      # The store tolerates ~2 req/s sustained; 700 ms (~1.3 req/s) sits inside that
      # with room for jitter. STORE_NOTES.md §8 has the measurements.
      - key: STORE_MIN_REQUEST_GAP_MS
        value: '700'
      - key: MAX_PRICE_DELTA_RATIO
        value: '0.7'
      - key: BROWSER_FALLBACK_ENABLED
        value: 'false'

      # --- optional: email alerts -------------------------------------------
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
