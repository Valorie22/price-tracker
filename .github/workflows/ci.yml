name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint frontend/src backend/src backend/scripts backend/tests --ext .ts,.tsx --max-warnings 0

      # The suite runs entirely offline: the extraction tests read real store responses
      # captured into recon/fixtures/, and the schema tests run db/schema.sql against
      # Postgres compiled to WebAssembly. No credentials, no Docker, no network.
      - name: Test
        run: npm test
        env:
          CI: 'true'

      - name: Build
        run: npm run build

      - name: Check nothing secret is committed
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.[^e]|secrets/)' ; then
            echo "::error::A secret-looking path is tracked by git"
            exit 1
          fi
          echo "no tracked secrets"
